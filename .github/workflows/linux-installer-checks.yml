name: Linux installer checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Linux file bytes and shell syntax
        run: |
          python3 tests/test_linux_line_endings.py
          bash -n reinstall.sh
          bash -n trans.sh
          sh -n update-kernel.sh
          bash -n tests/test_kernel_updates.sh
          bash -n tests/test_bios_console.sh
          bash -n tests/test_standard_kernel_selection.sh
          bash -n tests/test_standard_kernel_cleanup.sh
          bash -n tests/test_debian_installer_kernel.sh
      - name: Check Debian and Ubuntu kernel updates
        run: bash tests/test_kernel_updates.sh
      - name: Check standard kernel selection and migration
        run: |
          bash tests/test_standard_kernel_selection.sh
          bash tests/test_standard_kernel_cleanup.sh
      - name: Check BIOS console and ethx behaviour
        run: bash tests/test_bios_console.sh
      - name: Check Debian installer kernel matching
        run: bash tests/test_debian_installer_kernel.sh
